name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt --exclude-newer '3 days'
          .venv/bin/ruff check hermes_egm tests __init__.py
          .venv/bin/ruff format --check hermes_egm tests __init__.py
          .venv/bin/mypy -p hermes_egm
      - name: Test upstream report updates
        run: node --test .github/upstream-monitor.test.cjs

  host:
    name: Pinned Hermes
    uses: ./.github/workflows/hermes-validation.yml
