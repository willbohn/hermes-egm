name: hermes-egm
version: "0.2.0"
description: "Fresh-context, tool-free design reviews with checked source evidence and EGM workflow skills."
author: "William Bohn and Hermes Agent"
license: Apache-2.0
requires_hermes: ">=0.22.7"
provides_tools:
  - egm_review
provides_hooks: []
provides_middleware: []
requires_env: []
config_schema:
  activation:
    type: str
    choices: [manual, suggest, auto]
    default: suggest
    label: Activation mode
    description: "Suggest reviews by default. Auto requires an allowed project and a new session."
  auto_projects:
    type: list
    default: []
    label: Allowed automatic-review projects
    description: "JSON list of existing absolute project directories. Matches the session's starting workspace, not document provenance. Empty disables automatic review."
  auto_max_reviews_per_session:
    type: int
    default: 1
    label: Automatic attempts per session
    description: "Integer 1–3. Admitted failed/cancelled attempts count; automatic duplicates are blocked. Not a monetary limit."
  review_timeout_seconds:
    type: int
    default: 90
    label: Reviewer timeout (seconds)
    description: "Per-reviewer provider timeout, integer 10–3600. Raise for slow local models; invalid values fall back to 90. A per-reviewer coroutine deadline adds 5s."
  review_max_tokens:
    type: int
    default: 2400
    label: Reviewer output token budget
    description: "Per-reviewer requested output tokens, integer 256–16384. Reasoning models spend thinking tokens from this budget; raise for chatty routes. Invalid values fall back to 2400."
